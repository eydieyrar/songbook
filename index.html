<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songbook">
<meta name="theme-color" content="#faf3e0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Song Notebook</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#faf3e0;color:#28241e;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 12px 40px}
body.rd{overflow:hidden;padding:0}
h1{font-size:20px;margin:14px 0}
button{font:inherit;padding:8px 12px;border:1px solid #b9a97d;background:#fff8e6;border-radius:8px;color:inherit}
button.pri{background:#28241e;color:#fff;border-color:#28241e}
button.danger{color:#a00}
input,textarea{font:inherit;width:100%;padding:8px;border:1px solid #c9bb90;border-radius:6px;background:#fff}
textarea{min-height:120px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar .sp{flex:1}
.card{background:#fff;border:1px solid #d8cba5;border-radius:10px;padding:12px;margin:10px 0}
.song{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #e3d8b8}
.song b{display:block}
.song small{color:#7a6e50}
label{display:block;font-size:13px;color:#6b5f42;margin:8px 0 3px}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:10px;font-size:14px;color:inherit}
.chk input{width:auto}
.ln{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;border-bottom:1px dashed #d8cba5}
.ln .tools{display:flex;gap:6px}
.ln .tools button{padding:4px 10px}
.sync{font-size:13px;color:#6b5f42;margin:4px 0;min-height:1.2em}
.sync.warn{color:#a00}
.err{background:#fde8e8;border:1px solid #d99;padding:8px;border-radius:8px;margin:8px 0;font-size:14px}
/* lyrics view (Apple Music style) */
.am{position:fixed;left:0;right:0;top:0;bottom:0;z-index:10;background:var(--bg);color:#fff;overflow:hidden}
.am .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;pointer-events:none}
.am button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:18px;padding:8px 14px}
.am button.on{background:#fff;color:#111}
.amtop{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 24px;background:linear-gradient(var(--bg) 55%,transparent)}
.amt{flex:1;min-width:0}
.amt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt small{opacity:.7;font-size:13px}
.cover{display:none}
.ly{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(env(safe-area-inset-top) + 86px) 22px 480px}
.ly::-webkit-scrollbar{display:none}
.al{cursor:pointer;opacity:.32;filter:blur(1.3px);transition:opacity .35s,filter .35s,transform .35s;transform-origin:left center;margin-bottom:26px}
.al.act{opacity:1;filter:none;transform:scale(1.03)}
.al .jp{font-weight:800;line-height:1.28;margin:3px 0;font-size:calc(var(--k)*27px)}
.al .ro{display:block;opacity:.7;font-size:calc(var(--k)*12.5px)}
.al .en{display:block;opacity:.75;font-size:calc(var(--k)*14px)}
.al .nt{display:none;margin-top:6px;padding-left:8px;border-left:3px solid #f5c542;font-size:13px;opacity:.9}
.al.act .nt{display:block}
.hid{color:transparent!important;background:rgba(255,255,255,.2);border-radius:6px}
.anote{margin-top:30px;padding:14px;border-radius:14px;background:rgba(255,255,255,.1);white-space:pre-wrap;font-size:14px;line-height:1.5}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;display:flex;gap:6px;padding:6px;border-radius:26px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:96%}
.pill button{padding:8px 12px;white-space:nowrap}
@media (min-width:600px){
  .ly{padding:calc(env(safe-area-inset-top) + 110px) 56px 700px}
  .al{margin-bottom:36px}
  .al .jp{font-size:calc(var(--k)*40px)}.al .ro{font-size:calc(var(--k)*16px)}.al .en{font-size:calc(var(--k)*19px)}
  .amt b{font-size:19px}
}
@media (min-width:900px) and (orientation:landscape){
  .ly{padding:calc(env(safe-area-inset-top) + 64px) 56px 400px 400px}
  .al{margin-bottom:34px}
  .al .jp{font-size:calc(var(--k)*38px)}.al .ro{font-size:calc(var(--k)*15px)}.al .en{font-size:calc(var(--k)*18px)}
  .amt{visibility:hidden}
  .cover{display:block;position:absolute;left:44px;top:calc(env(safe-area-inset-top) + 80px);width:300px;z-index:4}
  .cover .art{width:300px;height:300px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:130px;font-weight:900}
  .cover .ct{font-size:22px;font-weight:700;margin-top:22px}
  .cover .ca{opacity:.7;margin-top:4px}
}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
(function () {
'use strict';
var LSKEY = 'songbook.v1';
var db = null, view = 'list', cur = null, status = '', curLine = 0;
var app = document.getElementById('app');

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function uid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function blank() { return { id: uid(), title: { jp: '', ro: '', en: '' }, artist: '', notes: '', lines: [{ ro: '', jp: '', en: '', note: '' }] }; }
function norm(d) {
  if (!d || !Array.isArray(d.songs)) return null;
  d.ui = d.ui || {}; d.ui.hide = d.ui.hide || {};
  d.ui.size = +d.ui.size || 1;
  d.deleted = Array.isArray(d.deleted) ? d.deleted : [];
  d.songs.forEach(normSong);
  return d;
}
function normSong(s) {
  s.title = s.title || {}; s.title.jp = s.title.jp || ''; s.title.ro = s.title.ro || ''; s.title.en = s.title.en || '';
  s.artist = s.artist || ''; s.notes = s.notes || ''; s.lines = s.lines || [];
  s.sha = s.sha || ''; s.dirty = !!s.dirty; s.updated = +s.updated || 0;
  return s;
}
function sample() {
  var s = blank();
  s.title = { jp: 'サンプル', ro: 'Sanpuru', en: 'Sample' };
  s.artist = 'Example Artist';
  s.lines = [{ ro: 'romaji line here', jp: '日本語の行', en: 'English line here', note: '' }];
  return { songs: [s], ui: { size: 1, hide: {} }, savedAt: 0 };
}

/* ---------- storage ---------- */
var idb = null;
function idbOpen(cb) {
  try {
    var r = indexedDB.open('songbook', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { idb = r.result; cb(null); };
    r.onerror = function () { cb(r.error || new Error('idb open failed')); };
  } catch (e) { cb(e); }
}
function idbGet(cb) {
  try {
    var q = idb.transaction('kv', 'readonly').objectStore('kv').get('db');
    q.onsuccess = function () { cb(null, q.result); };
    q.onerror = function () { cb(q.error); };
  } catch (e) { cb(e); }
}
function idbPut(str) {
  if (!idb) return;
  try {
    var t = idb.transaction('kv', 'readwrite');
    t.objectStore('kv').put(str, 'db');
    t.onerror = function () { setStatus('IndexedDB save failed. Make a backup.'); };
    t.onabort = t.onerror;
  } catch (e) { setStatus('IndexedDB save failed. Make a backup.'); }
}
function setStatus(m) { status = m; var el = document.getElementById('status'); if (el) { el.textContent = m; el.style.display = m ? 'block' : 'none'; } }
var lsOk = true;
function save() {
  db.savedAt = Date.now();
  var str = JSON.stringify(db);
  try { localStorage.setItem(LSKEY, str); lsOk = true; } catch (e) { lsOk = false; }
  idbPut(str);
  if (!lsOk && !idb) setStatus('Could not save anywhere. Make a backup now.');
}
function readLS() {
  try { var s = localStorage.getItem(LSKEY); return s ? norm(JSON.parse(s)) : null; } catch (e) { return null; }
}
function boot() {
  var done = false;
  var ls = readLS();
  function finish(fromIdb) {
    if (done) return; done = true;
    var pick = ls;
    if (fromIdb && (!pick || (fromIdb.savedAt || 0) > (pick.savedAt || 0))) pick = fromIdb;
    db = pick || sample();
    if (!pick) save();
    render();
    if (cfg) sync();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }
  var timer = setTimeout(function () { finish(null); }, 2000);
  idbOpen(function (err) {
    if (err) { clearTimeout(timer); setStatus('IndexedDB unavailable; using localStorage only.'); finish(null); return; }
    idbGet(function (e2, v) {
      clearTimeout(timer);
      var parsed = null;
      if (!e2 && v) { try { parsed = norm(JSON.parse(v)); } catch (e3) {} }
      finish(parsed);
    });
  });
}

/* ---------- sync (private GitHub repo, one file per song) ---------- */
var SYNCKEY = 'songbook.sync';
var cfg = loadCfg(), syncing = false, syncMsg = '', conf = {}, syncTimer = null;
function loadCfg() {
  try { var c = JSON.parse(localStorage.getItem(SYNCKEY) || 'null'); return c && c.token && c.owner && c.repo ? c : null; } catch (e) { return null; }
}
function enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function dec(b) { return decodeURIComponent(escape(atob(String(b).replace(/\s/g, '')))); }
function api(method, path, body) {
  var o = { method: method, cache: 'no-store', headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' } };
  if (body) { o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; }
  return fetch('https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + path, o).then(function (r) {
    return r.text().then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) {} return { status: r.status, json: j }; });
  });
}
function pack(s) { return { id: s.id, title: s.title, artist: s.artist, notes: s.notes, lines: s.lines, updated: s.updated }; }
function findSong(id) { for (var i = 0; i < db.songs.length; i++) if (db.songs[i].id === id) return i; return -1; }
function fetchSong(id) {
  return api('GET', '/contents/songs/' + id + '.json').then(function (r) {
    if (r.status !== 200 || !r.json || !r.json.content) throw { m: 'Could not read a song file (GitHub ' + r.status + ').' };
    var s = JSON.parse(dec(r.json.content)); s.id = id; s.sha = r.json.sha; s.dirty = false;
    return normSong(s);
  });
}
function putSong(s, sha) {
  var u = s.updated, body = { message: 'Update ' + (s.title.en || s.title.jp || s.id), content: enc(JSON.stringify(pack(s), null, 1)) };
  if (sha) body.sha = sha;
  return api('PUT', '/contents/songs/' + s.id + '.json', body).then(function (r) {
    if (r.status === 200 || r.status === 201) { s.sha = r.json.content.sha; s.dirty = (s.updated !== u); return 'ok'; }
    if (r.status === 409 || r.status === 422) return 'conflict';
    throw { m: r.status === 401 || r.status === 403 ? 'Token rejected or expired. Make a new one and paste it in Sync settings.' : 'GitHub error ' + r.status + ' while saving.' };
  });
}
function conflicts() { var n = 0, k; for (k in conf) if (conf.hasOwnProperty(k)) n++; return n; }
function setSync(m) {
  syncMsg = m;
  var el = document.getElementById('syncmsg');
  if (el) el.textContent = m;
}
function syncSoon() {
  if (!cfg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { sync(); }, 4000);
}
function touch(s) { s.dirty = true; s.updated = Date.now(); syncSoon(); }
function sync() {
  if (!cfg || syncing || !db) return Promise.resolve();
  syncing = true; setSync('Syncing…');
  var changed = false, remote = {};
  function chain(fns) { return fns.reduce(function (p, f) { return p.then(f); }, Promise.resolve()); }
  function dropTomb(id) { db.deleted = db.deleted.filter(function (d) { return d.id !== id; }); }
  return api('GET', '').then(function (r) {
    if (r.status === 401) throw { m: 'Token rejected or expired. Make a new one and paste it in Sync settings.' };
    if (r.status !== 200) throw { m: 'Repo not found. Check the username and repo name in Sync settings.' };
    return api('GET', '/contents/songs');
  }).then(function (r) {
    if (r.status === 200 && Array.isArray(r.json)) {
      r.json.forEach(function (f) { var m = /^([A-Za-z0-9_-]+)\.json$/.exec(f.name || ''); if (m) remote[m[1]] = f.sha; });
    } else if (r.status !== 404) throw { m: 'GitHub error ' + r.status + '.' };
    var steps = [], ids = {}, k;
    db.deleted.slice().forEach(function (d) {
      steps.push(function () {
        if (remote[d.id] && (!d.sha || remote[d.id] === d.sha)) {
          return api('DELETE', '/contents/songs/' + d.id + '.json', { message: 'Delete song', sha: remote[d.id] }).then(function (x) {
            if (x.status === 200) { delete remote[d.id]; dropTomb(d.id); } else dropTomb(d.id);
          });
        }
        dropTomb(d.id);
      });
    });
    db.songs.forEach(function (s) { ids[s.id] = 1; });
    for (k in remote) if (remote.hasOwnProperty(k)) ids[k] = 1;
    Object.keys(ids).forEach(function (id) {
      steps.push(function () {
        var i = findSong(id), s = i < 0 ? null : db.songs[i], rs = remote[id];
        if (!s) {
          if (!rs) return;
          return fetchSong(id).then(function (n) { db.songs.push(n); changed = true; });
        }
        function afterPut(res) {
          if (res === 'conflict') return fetchSong(id).then(function (n) { conf[id] = n; changed = true; });
          delete conf[id]; changed = true;
        }
        if (!rs) {
          if (s.dirty) { s.sha = ''; return putSong(s, '').then(afterPut); }
          if (s.sha) { db.songs.splice(i, 1); changed = true; }
          return;
        }
        if (rs === s.sha) { if (s.dirty) return putSong(s, rs).then(afterPut); return; }
        if (!s.dirty) return fetchSong(id).then(function (n) { db.songs[findSong(id)] = n; delete conf[id]; changed = true; });
        return fetchSong(id).then(function (n) { conf[id] = n; changed = true; });
      });
    });
    return chain(steps);
  }).then(function () {
    save();
    var c = conflicts(), d = new Date(), t = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    setSync((c ? c + (c > 1 ? ' songs need' : ' song needs') + ' your choice. ' : '') + 'Synced ' + t);
    if (changed && view !== 'edit') render(view === 'read');
  }).catch(function (e) {
    setSync(e && e.m ? e.m : 'Offline. Changes are saved here and will sync later.');
    if (view === 'list') render();
  }).then(function () { syncing = false; });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && cfg) sync(); });
window.addEventListener('online', function () { if (cfg) sync(); });

/* ---------- views ---------- */
function song() { for (var i = 0; i < db.songs.length; i++) if (db.songs[i].id === cur) return db.songs[i]; return null; }
function hue(s) {
  var t = s.title.jp || s.title.en || s.id, h = 0, i;
  for (i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360;
  return h;
}
function centre(smooth) {
  var sc = document.getElementById('sc'), a = sc && sc.querySelector('.al.act');
  if (!a) return;
  var t = a.offsetTop - sc.clientHeight * 0.33;
  if (smooth && sc.scrollTo) { try { sc.scrollTo({ top: t, behavior: 'smooth' }); return; } catch (e) {} }
  sc.scrollTop = t;
}
function setAct(i) {
  curLine = i;
  var ls = document.querySelectorAll('.al'), j;
  for (j = 0; j < ls.length; j++) { if (j === i) ls[j].classList.add('act'); else ls[j].classList.remove('act'); }
  centre(true);
}
function render(keep) {
  var old = document.getElementById('sc'), top = old ? old.scrollTop : 0;
  var h = '<div id="status" class="err" style="display:' + (status ? 'block' : 'none') + '">' + esc(status) + '</div>';
  if (view === 'list') h += listV();
  else if (view === 'read') h += readV();
  else if (view === 'edit') h += editV();
  else if (view === 'settings') h += settingsV();
  else if (view === 'conflict') h += conflictV();
  else h += backupV();
  app.innerHTML = h;
  document.body.className = view === 'read' ? 'rd' : '';
  if (view === 'read') {
    var sc = document.getElementById('sc');
    if (sc) { if (keep) sc.scrollTop = top; else centre(false); }
  }
}
function listV() {
  var h = '<h1>Song Notebook</h1><div class="bar"><button class="pri" data-act="new">+ New song</button><span class="sp"></span><button data-act="settings">Sync</button><button data-act="backup">Backup</button></div>' +
    '<div class="sync' + (conflicts() ? ' warn' : '') + '" id="syncmsg">' + esc(syncMsg || (cfg ? '' : 'Sync is off. Songs stay on this device.')) + '</div><div class="card" style="padding:0">';
  if (!db.songs.length) h += '<div class="song">No songs yet.</div>';
  db.songs.forEach(function (s) {
    h += '<div class="song"><div data-act="open" data-id="' + s.id + '" style="flex:1"><b>' + esc(s.title.jp || s.title.en || '(untitled)') + '</b><small>' + esc(s.artist) + ' · ' + s.lines.length + ' lines' + (s.dirty && cfg ? ' · not synced yet' : '') + '</small></div>' +
      (conf[s.id] ? '<button class="danger" data-act="conflict" data-id="' + s.id + '">Choose version</button> ' : '') +
      '<button data-act="edit" data-id="' + s.id + '">Edit</button></div>';
  });
  return h + '</div>';
}
function settingsV() {
  var c = cfg || { owner: '', repo: 'songbook-data', token: '' };
  return '<div class="bar"><button data-act="list">‹ Songs</button></div><div class="card"><b>Sync with GitHub</b>' +
    '<p style="font-size:14px">Songs are saved to your private repo, one file per song, so your iPad, iPhone and PC share them. The token stays on this device only and is never part of a backup.</p>' +
    '<label>GitHub username</label><input id="cfgOwner" autocapitalize="none" autocorrect="off" value="' + esc(c.owner) + '">' +
    '<label>Private repo name</label><input id="cfgRepo" autocapitalize="none" autocorrect="off" value="' + esc(c.repo) + '">' +
    '<label>Token (github_pat_…)' + (cfg ? ' – leave empty to keep the saved one' : '') + '</label><input id="cfgToken" type="password" autocapitalize="none" autocorrect="off" placeholder="' + (cfg ? '(saved)' : 'github_pat_…') + '">' +
    '<div class="bar"><button class="pri" data-act="cfgsave">Save and sync</button>' + (cfg ? '<button data-act="syncnow">Sync now</button><span class="sp"></span><button class="danger" data-act="cfgclear">Turn off</button>' : '') + '</div>' +
    '<div class="sync" id="syncmsg">' + esc(syncMsg) + '</div></div>';
}
function songInfo(s) {
  return '<b>' + esc(s.title.jp || s.title.en || '(untitled)') + '</b><br><small>' + s.lines.length + ' lines' + (s.updated ? ' · edited ' + new Date(s.updated).toLocaleString() : '') + '</small>';
}
function conflictV() {
  var s = song(), t = s && conf[s.id];
  if (!t) { view = 'list'; return listV(); }
  return '<div class="bar"><button data-act="list">‹ Songs</button></div><div class="card"><b>Two versions of this song</b>' +
    '<p style="font-size:14px">This song was changed on another device and also on this one. Choose what to keep.</p>' +
    '<div class="card">Mine (this device)<br>' + songInfo(s) + '</div><div class="card">Theirs (on GitHub)<br>' + songInfo(t) + '</div>' +
    '<div class="bar"><button class="pri" data-act="keepmine">Keep mine</button><button data-act="keeptheirs">Keep theirs</button><button data-act="keepboth">Keep both</button></div></div>';
}
function readV() {
  var s = song(); if (!s) { view = 'list'; return listV(); }
  if (curLine >= s.lines.length) curLine = 0;
  var h1 = hue(s), h2 = (h1 + 140) % 360, name = s.title.jp || s.title.en || '(untitled)', hide = db.ui.hide;
  var h = '<div class="am" style="--bg:hsl(' + h1 + ',45%,9%);--k:' + db.ui.size + '">' +
    '<i class="blob" style="width:420px;height:420px;background:hsl(' + h1 + ',85%,58%);left:-120px;top:-80px"></i>' +
    '<i class="blob" style="width:480px;height:480px;background:hsl(' + h2 + ',75%,55%);right:-160px;bottom:-120px"></i>' +
    '<div class="amtop"><button data-act="list">‹ Songs</button><div class="amt"><b>' + esc(name) + '</b><small>' + esc(s.artist) + '</small></div><button data-act="edit" data-id="' + s.id + '">Edit</button></div>' +
    '<div class="cover"><div class="art" style="background:linear-gradient(135deg,hsl(' + h1 + ',85%,58%),hsl(' + h2 + ',75%,45%))">歌</div><div class="ct">' + esc(name) + '</div><div class="ca">' + esc(s.artist) + '</div></div>' +
    '<div class="ly" id="sc">';
  s.lines.forEach(function (l, i) {
    h += '<div class="al' + (i === curLine ? ' act' : '') + '" data-i="' + i + '">' +
      (l.ro ? '<span class="ro' + (hide.ro ? ' hid' : '') + '">' + esc(l.ro) + '</span>' : '') +
      '<div class="jp' + (hide.jp ? ' hid' : '') + '">' + esc(l.jp) + '</div>' +
      (l.en ? '<span class="en' + (hide.en ? ' hid' : '') + '">' + esc(l.en) + '</span>' : '') +
      (l.note ? '<div class="nt">' + esc(l.note) + '</div>' : '') + '</div>';
  });
  if (s.notes) h += '<div class="anote">' + esc(s.notes) + '</div>';
  h += '</div><div class="pill"><button data-act="sz-">A−</button><button data-act="sz+">A+</button>' +
    ['ro', 'jp', 'en'].map(function (k) {
      return '<button data-act="hide" data-k="' + k + '"' + (hide[k] ? '' : ' class="on"') + '>' + ({ ro: 'Romaji', jp: '日本語', en: 'English' })[k] + '</button>';
    }).join('') + '</div></div>';
  return h;
}
function editV() {
  var s = song(); if (!s) { view = 'list'; return listV(); }
  var h = '<div class="bar"><button data-act="read" data-id="' + s.id + '">‹ View</button><span class="sp"></span><button class="danger" data-act="del">Delete song</button></div>' +
    '<div class="card"><label>Title (Japanese)</label><input data-f="title.jp" value="' + esc(s.title.jp) + '">' +
    '<label>Title (romaji)</label><input data-f="title.ro" value="' + esc(s.title.ro) + '">' +
    '<label>Title (English)</label><input data-f="title.en" value="' + esc(s.title.en) + '">' +
    '<label>Artist (e.g. 米津玄師 (Kenshi Yonezu))</label><input data-f="artist" value="' + esc(s.artist) + '">' +
    '<label>Notes (shown at the end of the song)</label><textarea data-f="notes">' + esc(s.notes) + '</textarea></div>' +
    '<div class="card"><label>Paste lyrics here, then split into lines</label><textarea id="paste"></textarea>' +
    '<div class="bar"><label class="chk"><input type="checkbox" id="dropsec" checked>Drop [Chorus] / 【サビ】 labels and (…) lines</label><button data-act="split">Split into lines</button></div></div>';
  s.lines.forEach(function (l, i) {
    h += '<div class="ln"><input data-k="ro" data-i="' + i + '" placeholder="romaji" value="' + esc(l.ro) + '">' +
      '<input data-k="jp" data-i="' + i + '" placeholder="日本語" value="' + esc(l.jp) + '">' +
      '<input data-k="en" data-i="' + i + '" placeholder="English" value="' + esc(l.en) + '">' +
      '<input data-k="note" data-i="' + i + '" placeholder="note (shown under the line when it is current)" value="' + esc(l.note) + '">' +
      '<div class="tools"><button data-act="up" data-i="' + i + '">↑</button><button data-act="down" data-i="' + i + '">↓</button><button data-act="ins" data-i="' + i + '">+ below</button><button class="danger" data-act="rm" data-i="' + i + '">✕</button></div></div>';
  });
  return h;
}
function backupV() {
  return '<div class="bar"><button data-act="list">‹ Songs</button></div><div class="card"><b>Backup</b><p style="font-size:14px">Copy this text and keep it somewhere safe. Restore replaces everything.</p>' +
    '<textarea id="bk" style="min-height:240px">' + esc(JSON.stringify(db)) + '</textarea>' +
    '<div class="bar"><button data-act="copy">Copy</button><button data-act="dl">Download</button><button class="danger" data-act="restore">Restore from text</button></div></div>';
}

/* ---------- editing helpers ---------- */
function setPath(s, path, v) { var p = path.split('.'); if (p.length === 2) s[p[0]][p[1]] = v; else s[p[0]] = v; }
function splitLines(text, drop) {
  var out = [];
  text.split(/\r?\n/).forEach(function (raw) {
    var t = raw.replace(/^[\s　]+|[\s　]+$/g, '');
    if (!t) return;
    if (drop && (/^\[[^\]]*\]$/.test(t) || /^【[^】]*】$/.test(t) || /^[(（][^)）]*[)）]$/.test(t))) return;
    out.push({ ro: '', jp: t, en: '', note: '' });
  });
  return out;
}
function download(name, text) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act],.al[data-i]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act'), s = song(), i = +t.getAttribute('data-i'), id = t.getAttribute('data-id');
  if (!act) {
    var hs = t.querySelectorAll('.hid'), q;
    for (q = 0; q < hs.length; q++) hs[q].classList.remove('hid');
    setAct(i);
    return;
  }
  if (act === 'new') { var n = blank(); touch(n); db.songs.push(n); cur = n.id; save(); view = 'edit'; }
  else if (act === 'settings') { view = 'settings'; }
  else if (act === 'conflict') { cur = id; view = 'conflict'; }
  else if (act === 'syncnow') { sync(); return; }
  else if (act === 'cfgsave') {
    var tok = document.getElementById('cfgToken').value.replace(/\s/g, '');
    var nc = { owner: document.getElementById('cfgOwner').value.replace(/\s/g, ''), repo: document.getElementById('cfgRepo').value.replace(/\s/g, ''), token: tok || (cfg ? cfg.token : '') };
    if (!nc.owner || !nc.repo || !nc.token) { setSync('Fill in the username, repo and token.'); return; }
    try { localStorage.setItem(SYNCKEY, JSON.stringify(nc)); } catch (x) { setSync('Could not save settings on this device.'); return; }
    cfg = nc; sync(); return;
  }
  else if (act === 'cfgclear') { try { localStorage.removeItem(SYNCKEY); } catch (x) {} cfg = null; syncMsg = ''; }
  else if (act === 'keepmine' || act === 'keeptheirs' || act === 'keepboth') {
    var th = conf[cur], ix = findSong(cur);
    if (!th || ix < 0) { view = 'list'; render(); return; }
    if (act === 'keepmine') { s.sha = th.sha; touch(s); }
    else if (act === 'keeptheirs') { db.songs[ix] = th; }
    else {
      var cp = JSON.parse(JSON.stringify(s)); cp.id = uid(); cp.sha = ''; cp.title.jp = (cp.title.jp || cp.title.en) + ' (mine)'; touch(cp);
      db.songs[ix] = th; db.songs.push(cp);
    }
    delete conf[cur]; save(); view = 'list'; sync();
  }
  else if (act === 'open' || act === 'read') { cur = id || cur; curLine = 0; view = 'read'; }
  else if (act === 'edit') { cur = id || cur; view = 'edit'; }
  else if (act === 'list') { view = 'list'; }
  else if (act === 'backup') { view = 'backup'; }
  else if (act === 'hide') { var k = t.getAttribute('data-k'); db.ui.hide[k] = !db.ui.hide[k]; save(); render(true); return; }
  else if (act === 'sz-' || act === 'sz+') {
    db.ui.size = Math.round(Math.max(0.75, Math.min(1.4, db.ui.size + (act === 'sz+' ? 0.1 : -0.1))) * 100) / 100;
    save(); render(true); return;
  }
  else if (act === 'del') {
    if (!confirm('Delete this song?')) return;
    if (s && s.sha) db.deleted.push({ id: s.id, sha: s.sha });
    delete conf[cur];
    db.songs = db.songs.filter(function (x) { return x.id !== cur; }); cur = null; save(); view = 'list'; syncSoon();
  }
  else if (act === 'split') {
    var txt = document.getElementById('paste').value, add = splitLines(txt, document.getElementById('dropsec').checked);
    if (!add.length) return;
    if (s.lines.length === 1 && !s.lines[0].jp && !s.lines[0].ro && !s.lines[0].en) s.lines = [];
    s.lines = s.lines.concat(add); touch(s); save();
  }
  else if (act === 'up' && i > 0) { var a = s.lines; a.splice(i - 1, 2, a[i], a[i - 1]); touch(s); save(); }
  else if (act === 'down' && i < s.lines.length - 1) { var b = s.lines; b.splice(i, 2, b[i + 1], b[i]); touch(s); save(); }
  else if (act === 'ins') { s.lines.splice(i + 1, 0, { ro: '', jp: '', en: '', note: '' }); touch(s); save(); }
  else if (act === 'rm') { s.lines.splice(i, 1); if (!s.lines.length) s.lines.push({ ro: '', jp: '', en: '', note: '' }); touch(s); save(); }
  else if (act === 'copy') {
    var ta = document.getElementById('bk'); ta.select();
    try { navigator.clipboard.writeText(ta.value); } catch (x) { document.execCommand('copy'); }
    return;
  }
  else if (act === 'dl') { download('songbook-backup.json', JSON.stringify(db)); return; }
  else if (act === 'restore') {
    var d; try { d = norm(JSON.parse(document.getElementById('bk').value)); } catch (x) { d = null; }
    if (!d) { alert('That text is not a valid backup.'); return; }
    if (!confirm('Replace ALL songs with this backup?')) return;
    d.songs.forEach(function (x) { if (!x.sha) x.dirty = true; });
    db = d; conf = {}; save(); view = 'list'; syncSoon();
  }
  render();
});
document.addEventListener('input', function (e) {
  var t = e.target, s = song();
  if (!s) return;
  if (t.hasAttribute('data-f')) { setPath(s, t.getAttribute('data-f'), t.value); touch(s); save(); }
  else if (t.hasAttribute('data-k') && t.hasAttribute('data-i')) { s.lines[+t.getAttribute('data-i')][t.getAttribute('data-k')] = t.value; touch(s); save(); }
});

boot();
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songbook">
<meta name="theme-color" content="#f2f2f7" id="themecolor">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Songbook</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--bg:#f2f2f7;--card:#fff;--fg:#000;--mu:#6e6e73;--line:rgba(60,60,67,.16);--ac:#fa2d48;--glass:rgba(255,255,255,.58);--glassb:rgba(255,255,255,.7);--sh:rgba(0,0,0,.16);--field:rgba(118,118,128,.12);color-scheme:light}
:root.dark{--bg:#000;--card:#1c1c1e;--fg:#fff;--mu:#98989f;--line:rgba(84,84,88,.5);--glass:rgba(58,58,62,.52);--glassb:rgba(255,255,255,.14);--sh:rgba(0,0,0,.5);--field:rgba(118,118,128,.24);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 28px var(--sh),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08)}
.layer{position:absolute;inset:0;background:var(--bg);overflow:hidden;container-type:inline-size;container-name:lay}
.layer.enter{animation:push .4s cubic-bezier(.32,.72,0,1)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
.body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(var(--sat) + 52px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 130px) max(16px,env(safe-area-inset-left,0px))}
.body::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(var(--sat) + 4px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));height:calc(var(--sat) + 64px);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.nav>*{pointer-events:auto}
.nav{background:linear-gradient(var(--bg) 0%,color-mix(in srgb,var(--bg) 90%,transparent) 35%,color-mix(in srgb,var(--bg) 55%,transparent) 65%,color-mix(in srgb,var(--bg) 14%,transparent) 90%,color-mix(in srgb,var(--bg) 0%,transparent) 100%)}
.pill{border:0;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--fg)}
.pill.pri{background:var(--ac);color:#fff;border:0}
.nav .pill{height:44px;padding:0 16px}
.nav .pill.round{padding:0}
.pill.dis{opacity:.4;pointer-events:none}
.pill.round{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.pill.round svg{display:block}
.navt{position:absolute;left:50%;top:calc(var(--sat) + 4px);transform:translateX(-50%);width:calc(100% - 250px);line-height:44px;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1.lg{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:4px 0 12px}
.srch{display:flex;align-items:center;height:52px;border-radius:999px;padding:0 18px;gap:10px;margin-bottom:14px;cursor:text}
.srch input{flex:1;border:0;background:none;outline:0;font-size:17px;min-width:0;height:100%}
.fw{position:relative;display:flex;align-items:center;flex:1;min-width:0;width:100%}
.fw.ta{align-items:flex-start}
.fw>input,.fw>textarea{flex:1;min-width:0}
.xc{display:none;position:relative;flex:none;width:20px;height:20px;margin-left:8px;border:0;padding:0;border-radius:50%;background:var(--mu);opacity:.55;color:var(--card);align-items:center;justify-content:center}
.xc::after{content:'';position:absolute;inset:-12px}
.fw.ta .xc{margin-top:2px}
.fw.has .xc{display:flex}
.xp{display:none;position:absolute;top:2px;right:0;width:28px;height:28px;border:0;padding:0;border-radius:50%;background:var(--field);color:#ff453a;align-items:center;justify-content:center}
.xp::after{content:'';position:absolute;inset:-8px}
.fw.has .xp{display:flex}
.fw.ta textarea{padding-right:36px}
.grp{background:var(--card);border-radius:20px;overflow:hidden;margin:0 0 18px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:58px}
.row:last-child{border-bottom:0}
.row b{display:block;font-size:16px;font-weight:600}.row small{color:var(--mu);font-size:13px}
.row .sp{flex:1;min-width:0}.row .sp b,.row .sp small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--mu);width:10px;height:16px;display:flex;align-items:center;justify-content:center;flex:none}
.chev svg{display:block}
.rt{display:flex;align-items:center;gap:12px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:#30d158;flex:none;display:block}.dot.o{background:#ff9f0a}
.cov{position:relative;overflow:hidden;width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;font-style:normal}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sec{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:18px 14px 6px}
.fld{padding:10px 14px;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:0;background:none;outline:0;resize:none;font-size:16px}
.fld textarea{min-height:90px;font-size:14px;line-height:1.4}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px}
.seg.solo{margin:0 0 18px;background:var(--card)}
.seg button{flex:1;border:0;background:none;font-size:14px;font-weight:600;padding:9px 0;border-radius:999px}
.seg button.on{background:rgba(118,118,128,.22)}
:root.dark .seg button.on{background:rgba(118,118,128,.42)}
.covers{display:flex;gap:10px;padding:12px 14px;overflow-x:auto;scrollbar-width:none}
.cv{flex:none;width:92px;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}
.cv i{display:block;position:relative;overflow:hidden;width:92px;height:92px;border-radius:12px;margin-bottom:4px;outline:3px solid transparent;outline-offset:2px;background:var(--field)}
.cv i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv.sel i{outline-color:var(--ac)}.cv.sel{color:var(--fg)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}
.sbtn{border:0;background:var(--field);font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;text-decoration:none;display:inline-block}
.sbtn.pri{background:var(--ac);color:#fff}
.sbtn.red{color:#ff453a}
.menu{margin:0 14px 10px;border-radius:16px;overflow:hidden;font-size:14px;transform-origin:top left}
.menu.in{animation:pop .18s ease-out}
.menu a{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.menu a:last-child{border-bottom:0}
.ln{background:var(--card);border-radius:18px;margin-bottom:10px;overflow:hidden}
.cell{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 14px;border-bottom:1px solid var(--line)}
.cell:last-child{border-bottom:0}
.cell .tag{font-size:10px;font-weight:700;color:var(--mu);width:20px;flex:none}
.cell.gap .tag{color:#ff9f0a}
.cell input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;padding:6px 0}
.cell.jp .tag{color:var(--ac)}
.cell.ro .tag,.cell.en .tag{opacity:.5}
.cell.gap .tag{opacity:1}
.cell.ro input,.cell.en input{font-size:14px;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.cell.note input{font-size:13px;font-style:italic;font-synthesis:none}
.cell .tag svg{display:block}
.cell.note.empty .tag{opacity:.4}
.mv button.off{opacity:.28;pointer-events:none}
.mv{display:flex;border-radius:999px;overflow:hidden;flex:none;gap:1px}
.mv button{border:0;background:var(--field);width:30px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;color:var(--fg)}
.mv button svg{display:block}
.lnact{display:flex;justify-content:flex-end;gap:6px;padding:6px 8px}
.lnact button{border:0;background:var(--field);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px}
.al2{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.al2 b{display:block;font-size:15px;font-weight:600}.al2 small{font-size:12.5px;color:var(--mu)}
.al2 .sp{flex:1;min-width:0}
.ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.ic.ok{background:rgba(48,209,88,.18);color:#30d158}.ic.warn{background:rgba(255,159,10,.22);color:#ff9f0a}
.al2 .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mu)}
.sync{font-size:13px;color:var(--mu);margin:4px 14px;min-height:1.2em}.sync.warn{color:#ff9f0a}
.note{font-size:13px;color:var(--mu);padding:8px 14px}
.err{background:rgba(255,69,58,.15);color:#ff453a;padding:8px 14px;border-radius:12px;margin:0 0 10px;font-size:14px}
.empty{padding:26px 16px;text-align:center;color:var(--mu);font-size:15px;line-height:1.5}
/* tab bar */
.tabs{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:30;display:flex;padding:5px;border-radius:999px;gap:2px;transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .3s ease}
.tabs.hide{transform:translateX(-50%) translateY(170%);opacity:0;pointer-events:none}
.tab{width:112px;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--mu);cursor:pointer}
.tab span{font-size:20px;line-height:1}
.tab.on{background:var(--glassb);color:var(--ac);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
/* lyrics reader */
.rd{position:absolute;inset:0;background:var(--rb);color:#fff;overflow:hidden}
.rd .blob,.rdbg .blob{position:absolute;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,currentColor 62%,transparent) 0%,color-mix(in srgb,currentColor 28%,transparent) 55%,color-mix(in srgb,currentColor 0%,transparent) 100%);pointer-events:none}
.rdbg{position:absolute;inset:0;z-index:0;background:var(--rb);overflow:hidden;pointer-events:none}
#app.pm .layer.topl,#app.pm .rd{background:transparent}
#app.pm .rd .blob{display:none}
.layer.enter{will-change:transform}
.snap *{filter:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.snap .layer.panel{background:#1b1b1f;will-change:left,top,bottom,width}
.snap *{transition:color .55s ease,background-color .55s ease,border-color .55s ease,box-shadow .55s ease}
.rd .nav{height:calc(var(--sat) + 100px);background:linear-gradient(hsl(var(--h) 45% 9%) 0%,hsl(var(--h) 45% 9% / .92) 28%,hsl(var(--h) 45% 9% / .7) 50%,hsl(var(--h) 45% 9% / .38) 70%,hsl(var(--h) 45% 9% / .12) 88%,hsl(var(--h) 45% 9% / 0) 100%)}
.rd .nav .pill{color:#fff}

.ly{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(var(--sat) + 110px) max(22px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
.ly::-webkit-scrollbar{display:none}
.al{opacity:.32;filter:blur(1.3px);padding:8px 0;margin-bottom:10px;transform:translateZ(0);will-change:opacity,filter,transform;transform-origin:left center;transition:opacity .35s,filter .35s,transform .35s;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.al.act{opacity:1;filter:none;transform:translateZ(0) scale(1.03)}
.al .jp{font-weight:800;font-size:calc(27px*var(--k,1));line-height:1.28;margin:3px 0}
.al .ro{font-size:calc(12.5px*var(--k,1));color:rgba(255,255,255,.7);display:block}
.al .en{font-size:calc(14px*var(--k,1));color:rgba(255,255,255,.75);display:block}
.al .nt{display:none;margin-top:6px;padding-left:8px;border-left:3px solid #f5c542;font-size:13px;color:rgba(255,255,255,.9);font-style:italic;font-synthesis:none}
.al.act .nt{display:block}
.al .ro.hid,.rhp.hid{transition:filter .3s,opacity .3s,text-shadow .3s}
:root[data-rs=blur][data-rl=light] .al .ro.hid,:root[data-rs=blur][data-rl=light] .rhp.hid{filter:blur(4px);opacity:.72}
:root[data-rs=blur][data-rl=strong] .al .ro.hid,:root[data-rs=blur][data-rl=strong] .rhp.hid{filter:blur(6.5px);opacity:.62}
:root[data-rs=glow][data-rl=light] .al .ro.hid,:root[data-rs=glow][data-rl=light] .rhp.hid{color:transparent!important;text-shadow:0 0 .55em rgba(255,255,255,.8),0 0 1.1em rgba(255,255,255,.25)}
:root[data-rs=glow][data-rl=strong] .al .ro.hid,:root[data-rs=glow][data-rl=strong] .rhp.hid{color:transparent!important;text-shadow:0 0 .9em rgba(255,255,255,.5),0 0 1.5em rgba(255,255,255,.15)}
.rhbox{margin:6px 0 0;padding:16px 18px 12px;border-radius:18px;background:#14161a;color:#fff}.rhbox .rb{margin:0 0 16px}.rhbox .rhp{display:block;font-size:calc(12.5px*var(--k,1));color:rgba(255,255,255,.72)}.rhbox .rj{font-size:calc(27px*var(--k,1));font-weight:800;line-height:1.28;margin:3px 0}.rhbox .rk{display:block;font-size:calc(14px*var(--k,1));color:rgba(255,255,255,.75)}.rhbox .rn{font-size:11px;color:rgba(255,255,255,.4);margin-top:-4px}
.al .enw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s cubic-bezier(.32,.72,0,1),opacity .4s ease}
.al .enw>.en{min-height:0;overflow:hidden;display:block;margin:0}
.al .enw.hid{grid-template-rows:0fr;opacity:0}
.al .enw.anim{-webkit-mask-image:linear-gradient(transparent,#000 16px);mask-image:linear-gradient(transparent,#000 16px)}
.anote{margin-top:30px;padding:14px;border-radius:14px;background:rgba(255,255,255,.1);white-space:pre-wrap;font-size:14px;line-height:1.5}
.cover{display:none}
.grpbar{display:flex;align-items:center;border-radius:999px;height:44px;padding:0 4px}
.grpbar button{border:0;background:none;color:#fff;font-size:15px;font-weight:600;height:36px;padding:0 13px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.grpbar .sepv{width:1px;height:18px;background:rgba(255,255,255,.3)}
.eyebtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:30;width:54px;height:54px;border-radius:50%;border:0;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.eyebtn::after{content:'';position:absolute;inset:-10px}
.vmenu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:40;width:240px;border-radius:22px;padding:6px;color:#fff;transform-origin:bottom right}
.vmenu.in{animation:popup .18s cubic-bezier(.32,.72,0,1)}
.vmenu div.dis{opacity:.35;pointer-events:none}
.vmenu div{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:16px;border-radius:16px;cursor:pointer}
.vmenu div+div{border-top:1px solid rgba(255,255,255,.14)}
.vmenu .ck{width:20px;text-align:right;font-weight:700}
.mscrim{position:absolute;inset:0;z-index:35}
/* popups: ease in and out */
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:scale(.88)}}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes sheetin{from{transform:translateY(120%);opacity:0}}
@keyframes sheetout{to{transform:translateY(120%);opacity:0}}
.vmenu.out,.menu.out{animation:popout .16s ease-in forwards}
@keyframes popup{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes popupout{to{opacity:0;transform:translateY(12px) scale(.9)}}
.vmenu.out{animation:popupout .18s cubic-bezier(1,0,.68,.28) forwards}
.scrim{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.35)}
.scrim.in{animation:fadein .22s ease-out}
.scrim.out{animation:fadeout .16s ease-in forwards}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;border-radius:30px;padding:8px;display:flex;flex-direction:column;gap:6px}
.sheet.in{animation:sheetin .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:sheetout .2s ease-in forwards}
.sheet button{border:0;font-size:17px;font-weight:600;padding:15px;border-radius:24px;background:var(--glassb)}
.sheet button.red{color:#ff453a}
.sheetnote{padding:12px 14px 6px;text-align:center;font-size:13px;color:var(--mu);line-height:1.4}
.pill,.sbtn,.tab,.grpbar button,.xround{position:relative}
.pill::after,.sbtn::after,.xround::after{content:'';position:absolute;inset:-8px}
.pill.round::after{inset:-10px}
.grpbar button::after{content:'';position:absolute;inset:-8px -2px}
.tab::after{content:'';position:absolute;inset:-22px -8px -14px}
.srch{position:relative}
.srch::after{content:'';position:absolute;inset:-8px -4px}
.xround{width:38px;height:38px;border-radius:50%;border:0;background:var(--field);color:#ff453a;display:flex;align-items:center;justify-content:center;padding:0}
.topscrim{display:none;position:fixed;left:0;right:0;top:0;height:calc(var(--sat) * 1.2);z-index:200;pointer-events:none;background:linear-gradient(rgba(24,24,32,.62) 55%,rgba(24,24,32,0))}
:root.ext .topscrim{display:block}
:root.dark .topscrim{background:linear-gradient(rgba(0,0,0,.72) 55%,rgba(0,0,0,0))}
.ptr{position:absolute;left:0;right:0;top:calc(var(--sat) + 16px);height:20px;line-height:20px;z-index:15;font-size:13px;font-weight:600;color:var(--mu);pointer-events:none;white-space:nowrap;will-change:transform}
.ptr span{position:absolute;left:0;right:0;text-align:center;opacity:0}
.edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:90;touch-action:none}
@media (min-width:600px){
  .body{max-width:720px;margin:0 auto;left:0;right:0}
}
@container lay (min-width:600px){
  .ly{padding-top:calc(var(--sat) + 120px);padding-left:56px;padding-right:56px}
  .al{margin-bottom:20px}
  .al .jp{font-size:calc(40px*var(--k,1))}.al .ro{font-size:calc(16px*var(--k,1))}.al .en{font-size:calc(19px*var(--k,1))}
}
@container lay (min-width:780px){
  @media (min-height:560px){
    .ly{padding-left:360px;padding-right:56px;padding-top:calc(var(--sat) + 80px)}
    .al{margin-bottom:18px}
    .al .jp{font-size:calc(30px*var(--k,1))}.al .ro{font-size:calc(13.5px*var(--k,1))}.al .en{font-size:calc(16px*var(--k,1))}
    .rd .navt{visibility:hidden}
    .cover{display:block;position:absolute;left:44px;top:calc(var(--sat) + 90px);width:260px;z-index:4}
    .cover .art{width:260px;height:260px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:112px}
    .cover .ct{font-size:21px;font-weight:700;margin-top:20px}
    .cover .ca{opacity:.7;margin-top:4px}
    .fbody{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr);gap:22px;overflow:hidden;max-width:none;margin:0;left:0;right:0;padding-bottom:0}
    .fbody .fcol{display:block;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;min-height:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 60px)}
    .fbody .fcol::-webkit-scrollbar{display:none}
  }
}
@container lay (min-width:1000px){
  @media (min-height:560px){

<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songbook">

<title>Songbook</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#000;--mu:#6e6e73;--line:rgba(60,60,67,.16);--ac:#fa2d48;--glass:rgba(255,255,255,.58);--glassb:rgba(255,255,255,.7);--sh:rgba(0,0,0,.16);--field:rgba(118,118,128,.12);color-scheme:light}
:root.dark{--bg:#000;--card:#1c1c1e;--fg:#fff;--mu:#98989f;--line:rgba(84,84,88,.5);--glass:rgba(58,58,62,.52);--glassb:rgba(255,255,255,.14);--sh:rgba(0,0,0,.5);--field:rgba(118,118,128,.24);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 28px var(--sh),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08)}
.layer{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.layer.enter{animation:push .34s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
.body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 64px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 130px) max(16px,env(safe-area-inset-left,0px))}
.body::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));height:calc(env(safe-area-inset-top,0px) + 62px);display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.nav>*{pointer-events:auto}
.pill{border:0;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--fg)}
.pill.pri{background:var(--ac);color:#fff;border:0}
.pill.dis{opacity:.4;pointer-events:none}
.pill.round{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.pill.round svg{display:block}
.navt{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1.lg{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:22px 0 12px}
.srch{display:flex;align-items:center;height:52px;border-radius:999px;padding:0 18px;gap:10px;margin-bottom:14px;cursor:text}
.srch input{flex:1;border:0;background:none;outline:0;font-size:17px;min-width:0;height:100%}
.grp{background:var(--card);border-radius:20px;overflow:hidden;margin:0 0 18px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:58px}
.row:last-child{border-bottom:0}
.row b{display:block;font-size:16px;font-weight:600}.row small{color:var(--mu);font-size:13px}
.row .sp{flex:1;min-width:0}.row .sp b,.row .sp small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--mu);font-size:18px}
.dot{width:8px;height:8px;border-radius:50%;background:#30d158;flex:none}.dot.o{background:#ff9f0a}
.cov{position:relative;overflow:hidden;width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;font-style:normal}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sec{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:18px 14px 6px}
.fld{padding:10px 14px;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:0;background:none;outline:0;resize:none;font-size:16px}
.fld textarea{min-height:90px;font-size:14px;line-height:1.4}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px}
.seg.solo{margin:0 0 18px;background:var(--card)}
.seg button{flex:1;border:0;background:none;font-size:14px;font-weight:600;padding:9px 0;border-radius:999px}
.seg button.on{background:rgba(118,118,128,.22)}
:root.dark .seg button.on{background:rgba(118,118,128,.42)}
.covers{display:flex;gap:10px;padding:12px 14px;overflow-x:auto;scrollbar-width:none}
.cv{flex:none;width:92px;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}
.cv i{display:block;position:relative;overflow:hidden;width:92px;height:92px;border-radius:12px;margin-bottom:4px;outline:3px solid transparent;outline-offset:2px;background:var(--field)}
.cv i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv.sel i{outline-color:var(--ac)}.cv.sel{color:var(--fg)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}
.sbtn{border:0;background:var(--field);font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;text-decoration:none;display:inline-block}
.sbtn.pri{background:var(--ac);color:#fff}
.sbtn.red{color:#ff453a}
.menu{margin:0 14px 10px;border-radius:16px;overflow:hidden;font-size:14px;transform-origin:top left}
.menu.in{animation:pop .18s ease-out}
.menu a{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.menu a:last-child{border-bottom:0}
.ln{background:var(--card);border-radius:18px;margin-bottom:10px;overflow:hidden}
.cell{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 14px;border-bottom:1px solid var(--line)}
.cell:last-child{border-bottom:0}
.cell .tag{font-size:10px;font-weight:700;color:var(--mu);width:20px;flex:none}
.cell.gap .tag{color:#ff9f0a}
.cell input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;padding:6px 0}
.cell.ro input{font-size:13px;color:var(--mu)}.cell.en input{font-size:14px}.cell.note input{font-size:13px;font-style:italic}
.mv{display:flex;border-radius:999px;overflow:hidden;flex:none;gap:1px}
.mv button{border:0;background:var(--field);width:30px;height:28px;font-size:12px}
.lnact{display:flex;justify-content:flex-end;gap:6px;padding:6px 8px}
.lnact button{border:0;background:var(--field);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px}
.al2{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.al2 b{display:block;font-size:15px;font-weight:600}.al2 small{font-size:12.5px;color:var(--mu)}
.al2 .sp{flex:1;min-width:0}
.ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.ic.ok{background:rgba(48,209,88,.18);color:#30d158}.ic.warn{background:rgba(255,159,10,.22);color:#ff9f0a}
.al2 .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mu)}
.sync{font-size:13px;color:var(--mu);margin:4px 14px;min-height:1.2em}.sync.warn{color:#ff9f0a}
.note{font-size:13px;color:var(--mu);padding:8px 14px}
.err{background:rgba(255,69,58,.15);color:#ff453a;padding:8px 14px;border-radius:12px;margin:0 0 10px;font-size:14px}
.empty{padding:26px 16px;text-align:center;color:var(--mu);font-size:15px;line-height:1.5}
/* tab bar */
.tabs{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:30;display:flex;padding:5px;border-radius:999px;gap:2px}
.tab{width:112px;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--mu);cursor:pointer}
.tab span{font-size:20px;line-height:1}
.tab.on{background:var(--glassb);color:var(--ac);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
/* lyrics reader */
.rd{position:absolute;inset:0;background:var(--rb);color:#fff;overflow:hidden}
.rd .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;pointer-events:none}
.rd .nav{background:linear-gradient(var(--rb) 45%,transparent);height:calc(env(safe-area-inset-top,0px) + 100px);align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.rd .nav .pill{color:#fff}
.ly{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 110px) max(22px,env(safe-area-inset-right,0px)) 60vh max(22px,env(safe-area-inset-left,0px))}
.ly::-webkit-scrollbar{display:none}
.al{opacity:.32;filter:blur(1.3px);margin-bottom:26px;transform-origin:left center;transition:opacity .35s,filter .35s,transform .35s;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.al.act{opacity:1;filter:none;transform:scale(1.03)}
.al .jp{font-weight:800;font-size:calc(27px*var(--k,1));line-height:1.28;margin:3px 0}
.al .ro{font-size:calc(12.5px*var(--k,1));opacity:.7;display:block}
.al .en{font-size:calc(14px*var(--k,1));opacity:.75;display:block}
.al .nt{display:none;margin-top:6px;padding-left:8px;border-left:3px solid #f5c542;font-size:13px;opacity:.9}
.al.act .nt{display:block}
.hid{color:transparent!important;background:rgba(255,255,255,.2);border-radius:6px}
.anote{margin-top:30px;padding:14px;border-radius:14px;background:rgba(255,255,255,.1);white-space:pre-wrap;font-size:14px;line-height:1.5}
.cover{display:none}
.grpbar{display:flex;align-items:center;border-radius:999px;height:44px;padding:0 4px}
.grpbar button{border:0;background:none;color:#fff;font-size:15px;font-weight:600;height:36px;padding:0 13px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.grpbar .sepv{width:1px;height:18px;background:rgba(255,255,255,.3)}
.vmenu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);z-index:40;width:240px;border-radius:22px;padding:6px;color:#fff;transform-origin:top right}
.vmenu.in{animation:pop .18s ease-out}
.vmenu div{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:16px;border-radius:16px;cursor:pointer}
.vmenu div+div{border-top:1px solid rgba(255,255,255,.14)}
.vmenu .ck{width:20px;text-align:right;font-weight:700}
.mscrim{position:absolute;inset:0;z-index:35}
/* popups: ease in and out */
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:scale(.88)}}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes sheetin{from{transform:translateY(120%);opacity:0}}
@keyframes sheetout{to{transform:translateY(120%);opacity:0}}
.vmenu.out,.menu.out{animation:popout .16s ease-in forwards}
.scrim{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.35)}
.scrim.in{animation:fadein .22s ease-out}
.scrim.out{animation:fadeout .16s ease-in forwards}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;border-radius:30px;padding:8px;display:flex;flex-direction:column;gap:6px}
.sheet.in{animation:sheetin .3s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:sheetout .2s ease-in forwards}
.sheet button{border:0;font-size:17px;font-weight:600;padding:15px;border-radius:24px;background:var(--glassb)}
.sheet button.red{color:#ff453a}
.edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:90;touch-action:none}
@media (min-width:600px){
  .ly{padding-top:calc(env(safe-area-inset-top,0px) + 120px);padding-left:56px;padding-right:56px}
  .al{margin-bottom:36px}
  .al .jp{font-size:calc(40px*var(--k,1))}.al .ro{font-size:calc(16px*var(--k,1))}.al .en{font-size:calc(19px*var(--k,1))}
  .body{max-width:720px;margin:0 auto;left:0;right:0}
}
@media (min-width:900px) and (orientation:landscape){
  .ly{padding-left:420px;padding-right:56px;padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
  .al{margin-bottom:34px}
  .al .jp{font-size:calc(38px*var(--k,1))}.al .ro{font-size:calc(15px*var(--k,1))}.al .en{font-size:calc(18px*var(--k,1))}
  .rd .navt{visibility:hidden}
  .cover{display:block;position:absolute;left:44px;top:calc(env(safe-area-inset-top,0px) + 90px);width:300px;z-index:4}
  .cover .art{width:300px;height:300px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:130px}
  .cover .ct{font-size:22px;font-weight:700;margin-top:22px}
  .cover .ca{opacity:.7;margin-top:4px}
}
</style>

<script>
(function () {
'use strict';
var LSKEY = 'songbook.v1', SYNCKEY = 'songbook.sync', VER = '1.0.1';
var CHANGES = [
  { v: '1.0.1', d: '18 Nov 2026', t: 'Polish', s: 'Smaller fixes to icons, menus and search after the redesign.', n: ['Real gear icon for Settings', 'Rounder eye icon', 'Language menu stays still when you toggle', 'Bigger search bar tap area', 'Version page with change notes'] },
  { v: '1.0.0', d: '18 Nov 2026', t: 'The iOS redesign', s: 'A new native iOS look, a safer way to add songs, and tools for lining up lyrics.', n: ['Glass tab bar, swipe back, Light / Dark / System', 'Save button for new songs, Discard prompt', 'Cover search, three paste fields, alignment card', 'Move or clear each language row separately', 'Hidden languages stay hidden, hold to peek'] },
  { v: '0.4', d: 'Nov 2026', t: 'No pinch zoom', s: 'The app no longer zooms when you pinch or double-tap.', n: ['Pinch-zoom blocked'] },

  { v: '0.2', d: 'Nov 2026', t: 'Lyrics view', s: 'Songs open as scrolling lyrics in the Apple Music style.', n: ['Apple Music style lyrics view', 'Hide a language to study'] },
  { v: '0.1', d: 'Nov 2026', t: 'First version', s: 'The first working app: add songs, read them, back them up.', n: ['Songs, backup and restore', 'Paper layout'] }
];
var db = null, status = '';
var tab = 'songs', stacks = { songs: [{ p: 'list' }], add: [{ p: 'form' }] };
var draft = null, pasteBuf = { jp: '', ro: '', en: '' }, covers = [], coverMsg = '', menuOpen = null, vmenu = false, sheet = false, query = '', curLine = 0;
var pushing = false, freshScroll = true, an = { v: 0, m: 0, s: 0 };
var KS = [0.85, 1, 1.15, 1.3], KN = ['Small', 'Default', 'Large', 'Extra large'], KL = ['S', 'M', 'L', 'XL'];
var app = document.getElementById('app');

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function uid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function blankLine() { return { ro: '', jp: '', en: '', note: '' }; }
function blank() { return normSong({ id: uid(), title: { jp: '', ro: '', en: '' }, artist: '', notes: '', lines: [] }); }
function norm(d) {
  if (!d || !Array.isArray(d.songs)) return null;
  d.ui = d.ui || {}; d.ui.hide = d.ui.hide || {};
  d.ui.sz = (d.ui.sz === 0 || d.ui.sz > 0) && d.ui.sz < 4 ? Math.floor(d.ui.sz) : 1;
  d.ui.theme = d.ui.theme === 'light' || d.ui.theme === 'dark' ? d.ui.theme : 'system';
  d.deleted = Array.isArray(d.deleted) ? d.deleted : [];
  d.songs.forEach(normSong);
  return d;
}
function normSong(s) {
  s.title = s.title || {}; s.title.jp = s.title.jp || ''; s.title.ro = s.title.ro || ''; s.title.en = s.title.en || '';
  s.artist = s.artist || ''; s.notes = s.notes || ''; s.lines = s.lines || [];
  s.lines.forEach(function (l) { l.ro = l.ro || ''; l.jp = l.jp || ''; l.en = l.en || ''; l.note = l.note || ''; });
  s.cover = s.cover || ''; s.src = s.src || {}; s.src.jp = s.src.jp || ''; s.src.ro = s.src.ro || ''; s.src.en = s.src.en || '';
  s.sha = s.sha || ''; s.dirty = !!s.dirty; s.updated = +s.updated || 0;
  return s;
}
function sample() {
  var s = blank();
  s.title = { jp: 'サンプル', ro: 'Sanpuru', en: 'Sample' };
  s.artist = 'Example Artist';
  s.lines = [{ ro: 'romaji line here', jp: '日本語の行', en: 'English line here', note: '' }];
  return { songs: [s], ui: { sz: 1, theme: 'system', hide: {} }, deleted: [], savedAt: 0 };
}

/* ---------- storage ---------- */
var idb = null;
function idbOpen(cb) {
  try {
    var r = indexedDB.open('songbook', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { idb = r.result; cb(null); };
    r.onerror = function () { cb(r.error || new Error('idb open failed')); };
  } catch (e) { cb(e); }
}
function idbGet(cb) {
  try {
    var q = idb.transaction('kv', 'readonly').objectStore('kv').get('db');
    q.onsuccess = function () { cb(null, q.result); };
    q.onerror = function () { cb(q.error); };
  } catch (e) { cb(e); }
}
function idbPut(str) {
  if (!idb) return;
  try {
    var t = idb.transaction('kv', 'readwrite');
    t.objectStore('kv').put(str, 'db');
    t.onerror = function () { setStatus('IndexedDB save failed. Make a backup.'); };
    t.onabort = t.onerror;
  } catch (e) { setStatus('IndexedDB save failed. Make a backup.'); }
}
function setStatus(m) { status = m; var el = document.getElementById('status'); if (el) { el.textContent = m; el.style.display = m ? 'block' : 'none'; } }
var lsOk = true;
function save() {
  db.savedAt = Date.now();
  var str = JSON.stringify(db);
  try { localStorage.setItem(LSKEY, str); lsOk = true; } catch (e) { lsOk = false; }
  idbPut(str);
  if (!lsOk && !idb) setStatus('Could not save anywhere. Make a backup now.');
}
function readLS() {
  try { var s = localStorage.getItem(LSKEY); return s ? norm(JSON.parse(s)) : null; } catch (e) { return null; }
}
function boot() {
  var done = false;
  var ls = readLS();
  function finish(fromIdb) {
    if (done) return; done = true;
    var pick = ls;
    if (fromIdb && (!pick || (fromIdb.savedAt || 0) > (pick.savedAt || 0))) pick = fromIdb;
    db = pick || sample();
    if (!pick) save();
    applyTheme();
    render();
    if (cfg) sync();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }
  var timer = setTimeout(function () { finish(null); }, 2000);
  idbOpen(function (err) {
    if (err) { clearTimeout(timer); setStatus('IndexedDB unavailable; using localStorage only.'); finish(null); return; }
    idbGet(function (e2, v) {
      clearTimeout(timer);
      var parsed = null;
      if (!e2 && v) { try { parsed = norm(JSON.parse(v)); } catch (e3) {} }
      finish(parsed);
    });
  });
}

/* ---------- theme ---------- */
var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  var t = db ? db.ui.theme : 'system';
  var dk = t === 'dark' || (t === 'system' && mq && mq.matches);
  document.documentElement.className = dk ? 'dark' : '';
  var m = document.getElementById('themecolor'); if (m) m.setAttribute('content', dk ? '#000000' : '#f2f2f7');
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

/* ---------- sync (private GitHub repo, one file per song) ---------- */
var cfg = loadCfg(), syncing = false, syncMsg = '', conf = {}, syncTimer = null;
function loadCfg() {
  try { var c = JSON.parse(localStorage.getItem(SYNCKEY) || 'null'); return c && c.token && c.owner && c.repo ? c : null; } catch (e) { return null; }
}
function enc(s) { return btoa(unescape(encodeURIComponent(s))); }
function dec(b) { return decodeURIComponent(escape(atob(String(b).replace(/\s/g, '')))); }
function api(method, path, body) {
  var o = { method: method, cache: 'no-store', headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' } };

/* ---------- render ---------- */
function centre(smooth) {

  st.forEach(function (p, i) {

  el.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)'; el.style.boxShadow = '-8px 0 30px rgba(0,0,0,.25)'; el.style.transform = 'translateX(100%)';

}

/* ---------- editing helpers ---------- */
function setPath(s, path, v) { var p = path.split('.'); if (p.length === 2) s[p[0]][p[1]] = v; else s[p[0]] = v; }
function splitLines(text) {

    var t = raw.replace(/^[\s　]+|[\s　]+$/g, '');
    if (!t) return;

}

}
function findCovers(s) {
  var link = (document.getElementById('spot') || {}).value || '', jobs = [], extra = [];
  if (/open\.spotify\.com\//.test(link)) {
    jobs.push(fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(link.trim())).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.title && !s.title.jp && !s.title.en) { s.title.jp = j.title; touch(s); }

    }).catch(function () {}));

      var seen = {}, out = [];

      (j.results || []).forEach(function (x) {

        if (u && !seen[u]) { seen[u] = 1; out.push({ u: u, l: (x.collectionName || 'Release') + (x.releaseDate ? ' · ' + x.releaseDate.slice(0, 4) : '') }); }

function resetDraft() { draft = blank(); pasteBuf = { jp: '', ro: '', en: '' }; covers = []; coverMsg = ''; sheet = false; menuOpen = null; }
function draftDirty() { var s = draft; return !!(s && (s.title.jp || s.title.ro || s.title.en || s.artist || s.notes || s.cover || s.lines.length || pasteBuf.jp || pasteBuf.ro || pasteBuf.en)); }
function updateAlign() { var el = document.getElementById('align'), s = fs(); if (el && s) el.innerHTML = alignH(s); }

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t || !db) return;
  var act = t.getAttribute('data-act'), i = +t.getAttribute('data-i'), k = t.getAttribute('data-k'), id = t.getAttribute('data-id'), s;
  if (act === 'tab') { if (tab === 'add' && k === 'songs' && !draft) {} tab = k; vmenu = false; freshScroll = true; if (k === 'add' && !draft) resetDraft(); render(); return; }
  if (act === 'open') { curLine = 0; push({ p: 'read', id: id }); return; }
  if (act === 'edit') { push({ p: 'edit', id: id }); return; }
  if (act === 'back') { popAnim(); return; }
  if (act === 'gear') { push({ p: 'set' }); return; }
  if (act === 'push') { push({ p: t.getAttribute('data-p') }); return; }
  if (act === 'conflict') { push({ p: 'conflict', id: id }); return; }
  if (act === 'line') {
    if (t.parentNode && t.parentNode.id === 'sc') {
      curLine = i;
      var ls = document.querySelectorAll('.al'), j;
      for (j = 0; j < ls.length; j++) { if (j === i) ls[j].classList.add('act'); else ls[j].classList.remove('act'); }
      centre(true);
    }
    return;
  }
  if (act === 'hide') {
    db.ui.hide[k] = !db.ui.hide[k]; save();
    var hs = document.querySelectorAll('.al .' + k), q;
    for (q = 0; q < hs.length; q++) hs[q].classList.toggle('hid', !!db.ui.hide[k]);
    var ck = document.querySelector('.vmenu [data-k="' + k + '"] .ck'); if (ck) ck.textContent = db.ui.hide[k] ? '' : '✓';
    return;
  }
  if (act === 'vmenu') { if (vmenu) closeAnim('.vmenu,.mscrim', function () { vmenu = false; render(true); }); else { vmenu = true; an.v = 1; render(true); } return; }
  if (act === 'vclose') { closeAnim('.vmenu', function () { vmenu = false; render(true); }); return; }
  if (act === 'theme') { db.ui.theme = k; save(); applyTheme(); render(true); return; }
  if (act === 'size') { db.ui.sz = +k; save(); render(true); return; }
  if (act === 'menu') { if (menuOpen === k) closeAnim('.menu', function () { menuOpen = null; render(true); }); else { menuOpen = k; an.m = 1; render(true); } return; }
  s = fs();
  if (act === 'covers') { if (s) findCovers(s); return; }
  if (act === 'cover') { if (s && covers[i]) { s.cover = covers[i].u; touch(s); if (s !== draft) save(); render(true); } return; }
  if (act === 'nocover') { if (s) { s.cover = ''; touch(s); if (s !== draft) save(); render(true); } return; }
  if (act === 'apply') {
    if (!s) return;
    var any = false;
    ['jp', 'ro', 'en'].forEach(function (c) {
      var arr = splitLines(pasteBuf[c]);
      if (!arr.length) return;
      any = true;
      while (s.lines.length < arr.length) s.lines.push(blankLine());
      arr.forEach(function (txt, n) { s.lines[n][c] = txt; });
      pasteBuf[c] = '';
    });
    if (any) { touch(s); if (s !== draft) save(); }
    render(true); return;
  }
  if (act === 'mv') {
    var d = +t.getAttribute('data-d'), o = i + d;
    if (s && o >= 0 && o < s.lines.length) { var x = s.lines[i][k]; s.lines[i][k] = s.lines[o][k]; s.lines[o][k] = x; touch(s); if (s !== draft) save(); render(true); }
    return;
  }
  if (act === 'clr') { if (s) { s.lines[i][k] = ''; touch(s); if (s !== draft) save(); render(true); } return; }
  if (act === 'ins') { if (s) { s.lines.splice(i + 1, 0, blankLine()); touch(s); if (s !== draft) save(); render(true); } return; }
  if (act === 'rm') { if (s) { s.lines.splice(i, 1); touch(s); if (s !== draft) save(); render(true); } return; }
  if (act === 'addline') { if (s) { s.lines.push(blankLine()); touch(s); if (s !== draft) save(); render(true); } return; }
  if (act === 'save') {
    if (cp().p === 'form') {
      if (!draft.title.jp.trim() && !draft.title.en.trim()) return;
      var n = draft; touch(n); db.songs.push(n); save(); syncSoon();
      resetDraft(); tab = 'songs'; stacks.songs = [{ p: 'list' }, { p: 'read', id: n.id }]; curLine = 0; pushing = true; freshScroll = true; render();
    } else popAnim();
    return;
  }
  if (act === 'cancel') { if (draftDirty()) { sheet = true; an.s = 1; render(true); } else { tab = 'songs'; freshScroll = true; render(); } return; }
  if (act === 'keep') { closeAnim('.sheet,.scrim', function () { sheet = false; render(true); }); return; }
  if (act === 'discard') { closeAnim('.sheet,.scrim', function () { resetDraft(); tab = 'songs'; freshScroll = true; render(); }); return; }
  if (act === 'del') {
    if (!s || !confirm('Delete this song?')) return;
    if (s.sha) db.deleted.push({ id: s.id, sha: s.sha });
    delete conf[s.id];
    db.songs = db.songs.filter(function (z) { return z.id !== s.id; }); save(); stacks.songs = [{ p: 'list' }]; freshScroll = true; syncSoon(); render(); return;
  }
  if (act === 'syncnow') { sync(); return; }
  if (act === 'cfgsave') {
    var tok = document.getElementById('cfgToken').value.replace(/\s/g, '');
    var nc = { owner: document.getElementById('cfgOwner').value.replace(/\s/g, ''), repo: document.getElementById('cfgRepo').value.replace(/\s/g, ''), token: tok || (cfg ? cfg.token : '') };
    if (!nc.owner || !nc.repo || !nc.token) { setSync('Fill in the username, repo and token.'); return; }
    try { localStorage.setItem(SYNCKEY, JSON.stringify(nc)); } catch (x) { setSync('Could not save settings on this device.'); return; }
    cfg = nc; sync(); return;
  }

  if (act === 'keepmine' || act === 'keeptheirs' || act === 'keepboth') {
    var cid = cp().id, th = conf[cid], ix = findSong(cid), mine = ix < 0 ? null : db.songs[ix];
    if (!th || !mine) { pop(); return; }

    else if (act === 'keeptheirs') { db.songs[ix] = th; }
    else {
      var cp2 = JSON.parse(JSON.stringify(mine)); cp2.id = uid(); cp2.sha = ''; cp2.title.jp = (cp2.title.jp || cp2.title.en) + ' (mine)'; touch(cp2);
      db.songs[ix] = th; db.songs.push(cp2);

  }
});
document.addEventListener('input', function (e) {
  var t = e.target; if (!db) return;
  if (t.id === 'q') { query = t.value; var pos = t.selectionStart; render(true); var q2 = document.getElementById('q'); if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (x) {} } return; }
  var s = fs();
  if (t.hasAttribute('data-p')) { pasteBuf[t.getAttribute('data-p')] = t.value; return; }
  if (!s) return;
  if (t.hasAttribute('data-f')) {
    setPath(s, t.getAttribute('data-f'), t.value); touch(s); if (s !== draft) save();
    var b = document.getElementById('savebtn'); if (b && cp().p === 'form') b.classList.toggle('dis', !s.title.jp.trim() && !s.title.en.trim());
  } else if (t.hasAttribute('data-s')) { s.src[t.getAttribute('data-s')] = t.value; touch(s); if (s !== draft) save(); }
  else if (t.hasAttribute('data-c')) { s.lines[+t.getAttribute('data-i')][t.getAttribute('data-c')] = t.value; touch(s); if (s !== draft) save(); updateAlign(); }
});
/* hold a hidden bar to peek; it hides again on release */
var peek = [];
document.addEventListener('pointerdown', function (e) {

});

document.addEventListener('pointerup', unpeek);
document.addEventListener('pointercancel', unpeek);
/* edge swipe back */
(function () {
  var drag = null;

})();
